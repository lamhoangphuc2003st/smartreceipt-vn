# ──────────────────────────────────────────────────────────────────────────────
# SmartReceipt VN — CI/CD Pipeline
#
# Triggers:
#   push / PR to main  → test
#   push to main only  → build Docker image (validates Dockerfile)
#
# Railway deploys automatically via GitHub integration on push to main.
# No deploy job needed here.
#
# Required GitHub Secrets:
#   RAILWAY_PUBLIC_URL — for post-deploy health check verification
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: smartreceipt-vn-api

jobs:
  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn[standard] slowapi python-multipart pydantic \
            google-genai opencv-python-headless Pillow numpy rapidfuzz \
            transformers \
            "torch==2.4.0+cpu" \
            "numpy<2" \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest httpx

      - name: Run tests
        env:
          # Dummy key — tests mock all external calls
          Gemini_API_Key: "test-key-ci"
          DISABLE_PHOBERT: "1"
        run: pytest tests/ -v --tb=short

  # ── Job 2: Build Docker image ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    # Only on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — validates Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache layers between builds for speed
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Verify Railway deployment ──────────────────────────────────────
  # Railway auto-deploys on push via GitHub integration.
  # This job just waits and verifies the live health endpoint.
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Railway to deploy
        run: sleep 60

      - name: Health check
        run: |
          curl -f "${{ secrets.RAILWAY_PUBLIC_URL }}/health" || \
            echo "Warning: health check failed — Railway may still be deploying"
