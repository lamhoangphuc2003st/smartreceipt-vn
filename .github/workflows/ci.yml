# ──────────────────────────────────────────────────────────────────────────────
# SmartReceipt VN — CI/CD Pipeline
#
# Triggers:
#   push / PR to main  → lint + test
#   push to main only  → build Docker image + deploy to Railway
#
# Required GitHub Secrets:
#   RAILWAY_TOKEN      — from Railway dashboard → Account Settings → Tokens
#   RAILWAY_SERVICE_ID — from Railway dashboard → Service → Settings → Service ID
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: smartreceipt-vn-api

jobs:
  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn[standard] slowapi python-multipart pydantic \
            google-genai opencv-python-headless Pillow numpy rapidfuzz \
            transformers \
            torch==2.2.2+cpu \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest httpx

      - name: Run tests
        env:
          # Dummy key — tests mock all external calls
          Gemini_API_Key: "test-key-ci"
          DISABLE_PHOBERT: "1"
        run: pytest tests/ -v --tb=short

  # ── Job 2: Build Docker image ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    # Only on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — validates Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache layers between builds for speed
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Railway ───────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway deploy --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach

      - name: Verify deployment health
        run: |
          echo "Waiting for Railway to deploy..."
          sleep 30
          # Health check against the live URL
          curl -f "${{ secrets.RAILWAY_PUBLIC_URL }}/health" || \
            echo "Warning: health check failed — Railway may still be starting up"
